name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - lint, test, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage

  frontend:
    name: Frontend - lint, test, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  api-tests:
    name: API tests - Postman/Newman
    needs: backend
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://localhost:27017/gamevault_ci
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      ADMIN_EMAIL: admin@gamevault.local
      ADMIN_PASSWORD: Admin@12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run seed
        working-directory: backend
      - name: Start API
        working-directory: backend
        run: |
          nohup npm start > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/api/health && break
            sleep 1
          done
      - name: Run Newman
        run: >
          npx --yes newman@6 run postman/GameVault.postman_collection.json
          -e postman/GameVault.local.postman_environment.json
          --reporters cli,junit --reporter-junit-export newman-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-results
          path: |
            newman-results.xml
            backend/api.log

  docker:
    name: Docker images build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gamevault-api ./backend
      - run: docker build -t gamevault-web ./frontend
